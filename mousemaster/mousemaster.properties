# =============================================================================
#  VimWindows - Mousemaster Configuration (Custom Mouse Backend)
# =============================================================================

key-alias.slow=leftshift
key-alias.fast=leftctrl

# -----------------------------------------------------------------------------
#  Idle Mode (Dormant: Passes all keystrokes to Windows & VimWindows)
# -----------------------------------------------------------------------------
idle-mode.push-mode-to-history-stack=true
idle-mode.to.mouse-mode=+f13

# -----------------------------------------------------------------------------
#  Mouse Mode (Dedicated Mouse Control Backend)
# -----------------------------------------------------------------------------
mouse-mode.indicator.enabled=true
mouse-mode.indicator.color=#2E7D32
mouse-mode.indicator.size=18
mouse-mode.indicator.opacity=0.9
mouse-mode.push-mode-to-history-stack=true

# Exit back to VimWindows NORMAL MODE
mouse-mode.to.idle-mode=+esc | +c | +q | +f13

# Continuous Accelerated Mouse Movement (Vim HJKL + Arrow Keys)
mouse-mode.mouse.initial-velocity=900
mouse-mode.mouse.max-velocity=2400 | _{slow} -> 250 | _{fast} -> 4800
mouse-mode.mouse.acceleration=2800 | _{fast} -> 5500
mouse-mode.mouse.acceleration-easing=smootherstep
mouse-mode.mouse.deceleration=25

mouse-mode.start-move.left=+h | +left
mouse-mode.start-move.down=+j | +down
mouse-mode.start-move.up=+k | +up
mouse-mode.start-move.right=+l | +right

mouse-mode.stop-move.left=-h | -left
mouse-mode.stop-move.down=-j | -down
mouse-mode.stop-move.up=-k | -up
mouse-mode.stop-move.right=-l | -right

# Mouse Clicks
mouse-mode.press.left=+space | +m | +enter
mouse-mode.release.left=-space | -m | -enter

mouse-mode.press.right=_{leftshift} +space | +r | +n
mouse-mode.release.right=-space | -r | -n

mouse-mode.press.middle=+, | +minus
mouse-mode.release.middle=-, | -minus

# Drag Mode (Hold left button and move)
mouse-mode.to.drag-mode=+d | +v
drag-mode.to.mouse-mode=+d | +v | +esc
drag-mode.to.idle-mode=+esc
drag-mode.indicator.enabled=true
drag-mode.indicator.color=#D32F2F
drag-mode.indicator.size=22
drag-mode.press.left=+none
drag-mode.release.left=+esc | +d | +v
drag-mode.mouse=mouse-mode.mouse
drag-mode.start-move=mouse-mode.start-move
drag-mode.stop-move=mouse-mode.stop-move

# Grid Jump Mode (3x3 screen quadrants)
mouse-mode.to.grid-mode=+g
grid-mode.to.mouse-mode=+c | +esc
grid-mode.to.idle-mode=+esc
grid-mode.grid.area=active-screen
grid-mode.grid.row-count=3
grid-mode.grid.column-count=3
